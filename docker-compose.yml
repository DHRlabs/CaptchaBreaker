services:
  captchabreaker:
    build: .
    image: captchabreaker:latest
    container_name: captchabreaker
    ports:
      - "8977:8977"
    environment:
      # No keys or providers: CaptchaBreaker is fully local and offline.
      - CAPTCHABREAKER_PORT=8977
      - CAPTCHABREAKER_DEBUG=0
    restart: unless-stopped
