[project]
name = "captchabreaker"
version = "0.2.0"
description = "Self-contained CAPTCHA-solving service for browser-puppeteering LLM agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rapidocr-onnxruntime>=1.4",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pygments>=2.17",
    "websocket-client>=1.7",
]
dev = [
    "pytest>=8.0",
    "pygments>=2.17",
    "websocket-client>=1.7",
]
browser = [
    "websocket-client>=1.7",
]

[project.scripts]
captchabreaker = "captchabreaker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["captchabreaker*"]

[tool.setuptools.package-data]
"captchabreaker" = ["captcha_ocr_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
